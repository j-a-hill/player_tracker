# Downtime adventures for Tales from Fellgard.
# Each one can be done once per player unless it has `repeatable: true`.
# Rewards: gold (decimals allowed, e.g. 0.5 = 5 sp) and items. There is no XP;
# levels come from sessions played.

adventures:
  night_watch:
    name: A Night on the Wall
    description: Hedda is short of soldiers. Stand a night's watch at the north-east corner of the fort.
    start_node: intro
    nodes:
      intro:
        text: >-
          Hedda can't spare a soldier for the north-east corner, so she's asked you to
          take the night there. You stand on the palisade where it meets the old wall,
          with the empty wooden lookout on the slope in front of you. The fire in the
          refugee camp burns down and the courtyard goes quiet. Some time past
          midnight you see someone outside the fort, below you on the slope, going
          down through the scrub and pines towards the river with their hood up.
        choices:
          - label: Shout a challenge
            next: challenge
          - label: Go after them
            next: follow
          - label: Keep still and watch
            next: watch
      challenge:
        text: >-
          Your shout carries across the slope. The figure stops for a moment, then
          drops out of sight among the pines. Nobody comes back up the slope before
          dawn. In the morning Hedda hears you out and asks how tall they were and how
          they moved. She doesn't say much else, and pays you for the night.
        rewards:
          gold: 0.5
        is_end: true
      follow:
        text: >-
          By the time you're down off the wall and out of the gate, there's no sign of
          them. You pick your way down to the river in the dark. You can hear the
          water, and once, somewhere downstream, footsteps on stone. Then nothing. You
          climb back up cold and wet to the knees. Hedda pays you for the night and
          tells you not to leave your post again.
        rewards:
          gold: 0.5
        is_end: true
      watch:
        text: >-
          You keep still. The figure goes into the trees and you lose them. About an
          hour before dawn someone comes back up the slope the same way, hood still
          up, and you lose sight of them behind the palisade. In the morning you
          collect your pay from Hedda.
        rewards:
          gold: 0.5
        is_end: true

  hilds_well:
    name: Ribbons at the Bridge
    description: Walk down to the stone bridge below the fort, where people tie ribbons to the rowan by the well.
    start_node: intro
    nodes:
      intro:
        text: >-
          The road to Hartholt crosses the Wyrm on a stone bridge below the fort.
          Beside it is Hild's Well, a stone-lined spring under a rowan tree. Faded
          ribbons hang from every branch you can reach, and the water is cold enough
          to hurt your teeth. On the flat stone at the lip of the well, someone has
          laid out pins in neat rows, all pointing the same way.
        choices:
          - label: Tie a ribbon and drop in a pin
            next: offering
          - label: Pocket the pins
            next: take
          - label: Come back after dark and watch
            next: watch
      offering:
        text: >-
          You tear a strip of cloth, knot it to a low branch and drop a pin into the
          well. It goes down a long way before you lose sight of it. On your way back
          up to the fort you look at the stone again. There's one more pin in the last
          row than there was before.
        is_end: true
      take:
        text: >-
          You sweep the pins into your hand. They're ordinary dress pins, a few of
          them bent. That night you sleep badly. In the morning your boots are tied
          together by the laces, knotted so tight you have to cut them apart, and the
          pins are gone from your pack.
        is_end: true
      watch:
        text: >-
          You find a spot among the pines across the road, out of the wind, and wait.
          Late on, something small comes down the bank. It's no taller than your
          knee, hunched, with long thin fingers. It starts untying a ribbon from the
          rowan, quick and careful, and then it sees you. It's gone before you're on
          your feet. In the morning there's one ribbon fewer on the tree.
        is_end: true

  stores_rats:
    name: Rats in the Stores
    description: Brenna wants something done about whatever is getting into the stores at night.
    start_node: intro
    nodes:
      intro:
        text: >-
          Brenna stops you in the courtyard. Something has been at the stores at
          night. Sacks have been gnawed through, there are oats all over the floor,
          and the droppings are the size of your thumb. She'll pay two gold to see it
          stopped.
        choices:
          - label: Sit up with a lantern and a club
            next: fight
          - label: Find where they get in and block it
            next: block
          - label: Buy poison from the herbalist (5 sp)
            next: poison
            requirement:
              gold: 0.5
      fight:
        text: >-
          You wait in the dark with the lantern hooded. Late on, the sacks start to
          move. Three rats the size of small dogs come out from behind the barrels,
          and when you uncover the lantern they go for you. You kill two. The third
          bites you on the way past and gets out through a hole at the foot of the
          back wall. Brenna looks at the bodies in the morning and pays up.
        rewards:
          gold: 2
        is_end: true
      block:
        text: >-
          It takes most of a day shifting barrels. Behind the last of them is a hole
          at the foot of the wall, worn smooth and big enough to get your fist
          through. You pack it with stones and daub it with mud. Most of the barrels
          you moved were empty or nearly so. Brenna checks the wall and pays you.
        rewards:
          gold: 2
        is_end: true
      poison:
        text: >-
          The herbalist in the refugee camp mixes something grey into a twist of cloth
          and charges you five silver. While he works he asks where you're all headed
          next, and which way you'll go. The next morning there are four dead rats in
          the stores, and Brenna pays you.
        rewards:
          gold: 2
        penalties:
          gold: 0.5
        is_end: true
